name = "nazo-tracker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "nazo-tracker"
# 本番 D1 作成後に `wrangler d1 create nazo-tracker` が出力する ID に置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[assets]
directory = "./public"

[vars]
# CSRF の Origin 照合・cookie の Secure 判定に使う。ローカルでは .dev.vars で http://127.0.0.1:8787 に上書きする
APP_ORIGIN = "https://nazo.shino3.net"
# "1" のときだけ仮ログイン /_dev/login を有効にする。本番は必ず "0"（APP_ORIGIN が https://nazo.shino3.net なので "1" にしても無効）
AUTH_DEV_LOGIN = "0"
# オーナーにする identity（provider:subject のカンマ区切り、完全一致）。例: "discord:123456789012345678"
OWNER_IDENTITIES = ""
# Google の OAuth クライアント ID。空のあいだは Google ログインが「準備中」になる
GOOGLE_CLIENT_ID = ""
# Discord の OAuth クライアント ID。空のあいだは Discord ログインが「準備中」になる
DISCORD_CLIENT_ID = ""
# "1" のときだけ部品見本 GET /_ui を有効にする。ローカルでは .dev.vars で上書きする
UI_GALLERY = "0"

# SESSION_SECRET・GOOGLE_CLIENT_SECRET・DISCORD_CLIENT_SECRET は secret。`wrangler secret put <NAME>` で入れる（ローカルは .dev.vars）
